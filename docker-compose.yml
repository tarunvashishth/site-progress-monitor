# API + worker against your Supabase project (cloud, or `supabase start` on a machine with Docker).
# The frontend is deployed separately (Vercel) or run with `npm run dev` in web/.
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
  worker:
    build: ./backend
    env_file: ./backend/.env
    command: ["python", "-m", "cpm.worker.main"]
    restart: unless-stopped
    # Single persistent worker is enough for the MVP. Add `deploy.replicas` later: job claiming uses SKIP LOCKED.
  # Web app (Next.js). Public NEXT_PUBLIC_* values are baked in at build; override via .env next to this file.
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://zlszrookwxurvollnbvb.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_gPA1fLzgnJwa5oxEJ9YYRA_zlcfFImq}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://spm-api.cuelatch.com}
        NEXT_PUBLIC_MAX_VIDEO_MB: ${NEXT_PUBLIC_MAX_VIDEO_MB:-2048}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    restart: unless-stopped
  # Free public HTTPS URL via Cloudflare Tunnel: `docker compose --profile tunnel up --build`.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    # Named tunnel: TUNNEL_TOKEN comes from .env; hostname/ingress are configured in Cloudflare.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [api, web]
    restart: unless-stopped
